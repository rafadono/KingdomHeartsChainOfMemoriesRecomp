name: Build KHCOMRecomp

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Build Project
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1 -Target KHCOMRecomp -Config Release

      - name: Stage Distribution Package
        shell: powershell
        run: |
          $dist = "KHCOMRecomp-Windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          
          Copy-Item "build\Release\KHCOMRecomp.exe" -Destination $dist
          Copy-Item "build\Release\SDL2.dll" -Destination $dist
          Copy-Item "keybinds.ini" -Destination $dist
          Copy-Item "README.md" -Destination $dist
          Copy-Item -Recurse "config" -Destination (Join-Path $dist "config")
          Copy-Item -Recurse "docs" -Destination (Join-Path $dist "docs")
          
          Compress-Archive -Path "$dist\*" -DestinationPath "$dist.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHCOMRecomp-Windows-x64
          path: KHCOMRecomp-Windows-x64.zip
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KHCOMRecomp-Windows-x64.zip
          generate_release_notes: true
